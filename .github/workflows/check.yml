name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  texlive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended context python3 make
      - name: Numerical tests and format matrix
        run: make test
      - name: Example documents
        run: make examples
      - name: Manual, archives and isolated installation
        run: make dist
      - name: Check generated catalogue is current
        run: |
          make materials
          git diff --exit-code -- tex/generic/luafemm/luafemm-materials-data.lua docs/materials-catalog.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luafemm-build
          path: |
            build/tests/*.log
            build/formats/*/*.log
            build/formats/results.json
            build/examples/*.pdf
            build/doc/*.pdf
            build/dist/*.zip
            build/dist/SHA256SUMS
            build/dist/installation.json
